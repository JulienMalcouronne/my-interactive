name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Corepack activates the Yarn version pinned in package.json
      # (packageManager: yarn@4.9.1). Must run before any `yarn` call — hence
      # no `cache: yarn` on setup-node, which would invoke Yarn 1 too early.
      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Cache Yarn packages
        uses: actions/cache@v4
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Format check
        run: yarn format:check

      - name: Type check
        run: yarn typecheck

      - name: Tests + coverage
        run: yarn test:coverage

      - name: Build
        run: yarn build
        env:
          # Build needs no DB (dynamic pages hit it at request time); fall back to
          # placeholders so metadata/sitemap resolve during static generation.
          NEXT_PUBLIC_BASE_URL: https://example.com
          COOKIE_SECRET: ci-placeholder-secret
